<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FROG JUMP: 2D Physics Mechanics - WebGL Build</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1217;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #game-canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 12px;
      font-weight: 600;
    }
    .hud-box {
      background: rgba(23, 25, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hud-title {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .gauge {
      width: 140px;
      height: 8px;
      background: #23272f;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 2px;
    }
    .gauge-fill {
      height: 100%;
      width: 0%;
      background: #2dd4bf;
      transition: width 0.05s linear;
    }
    #controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(23, 25, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 11px;
      color: #d1d5db;
      pointer-events: none;
      white-space: nowrap;
    }
    #victory-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(13, 18, 23, 0.88);
      backdrop-filter: blur(8px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    button.btn {
      background: #2dd4bf;
      color: #0f172a;
      font-weight: 700;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    button.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
  <div id="victory-modal">
    <h2 style="font-size: 24px; font-weight: 800; color: #2dd4bf;">APEX ALTITUDE REACHED</h2>
    <p id="vic-sub" style="color: #9ca3af; font-size: 14px;">Perfect ballistic trajectory calculation achieved.</p>
    <button class="btn" onclick="resetFrogGame()">RESTART RUN</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const chargeFill = document.getElementById('charge-fill');
    const physicsStat = document.getElementById('physics-stat');
    const scoreText = document.getElementById('score-text');
    const victoryModal = document.getElementById('victory-modal');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Physics parameters (Verlet-like simulation)
    const GRAVITY = 0.45;
    const DRAG = 0.995;
    const MAX_POWER = 18;

    let frog = {
      x: 140,
      y: 400,
      vx: 0,
      vy: 0,
      radius: 16,
      onGround: false,
      squash: 1, // Visual deformation squash/stretch
      currentPlatform: null
    };

    let platforms = [
      { x: 80, y: 440, w: 180, h: 22 },
      { x: 300, y: 380, w: 140, h: 20 },
      { x: 480, y: 280, w: 160, h: 20 },
      { x: 260, y: 200, w: 140, h: 20 },
      { x: 480, y: 120, w: 180, h: 20 },
      { x: 720, y: 240, w: 150, h: 20 },
      { x: 740, y: 380, w: 160, h: 20 }
    ];

    let fireflies = [
      { x: 370, y: 330, collected: false },
      { x: 560, y: 230, collected: false },
      { x: 330, y: 150, collected: false },
      { x: 570, y: 80, collected: false },
      { x: 790, y: 190, collected: false }
    ];

    let charging = false;
    let chargeAmount = 0; // 0 to 1
    let aimAngle = -Math.PI / 4;
    let fliesCollected = 0;

    // Mouse / Touch input
    let mousePos = { x: 300, y: 300 };

    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
      if (charging) {
        aimAngle = Math.atan2(mousePos.y - frog.y, mousePos.x - frog.x);
      }
    });

    window.addEventListener('mousedown', () => {
      if (frog.onGround) {
        charging = true;
        chargeAmount = 0.1;
      }
    });

    window.addEventListener('mouseup', () => {
      if (charging) {
        launchFrog();
      }
    });

    // Keyboard support
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && frog.onGround && !charging) {
        charging = true;
        chargeAmount = 0.1;
      }
      if (e.key === 'ArrowLeft' || e.key === 'a') aimAngle -= 0.1;
      if (e.key === 'ArrowRight' || e.key === 'd') aimAngle += 0.1;
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'Space' && charging) {
        launchFrog();
      }
    });

    function launchFrog() {
      charging = false;
      const power = chargeAmount * MAX_POWER;
      frog.vx = Math.cos(aimAngle) * power;
      frog.vy = Math.sin(aimAngle) * power;
      frog.onGround = false;
      frog.currentPlatform = null;
      frog.squash = 0.7; // Stretch on launch
    }

    function resetFrogGame() {
      frog.x = 140;
      frog.y = 400;
      frog.vx = 0;
      frog.vy = 0;
      frog.onGround = false;
      fliesCollected = 0;
      fireflies.forEach(f => f.collected = false);
      victoryModal.style.display = 'none';
    }

    // Parabolic Prediction Arc
    function calculateTrajectory(startX, startY, vx, vy, steps = 35) {
      const points = [];
      let simX = startX;
      let simY = startY;
      let simVx = vx;
      let simVy = vy;

      for (let i = 0; i < steps; i++) {
        points.push({ x: simX, y: simY });
        simVx *= DRAG;
        simVy += GRAVITY;
        simX += simVx;
        simY += simVy;

        // Stop if hitting a platform
        for (let p of platforms) {
          if (simX > p.x && simX < p.x + p.w && simY > p.y && simY < p.y + p.h) {
            return points;
          }
        }
      }
      return points;
    }

    function update() {
      // Charge update
      if (charging) {
        chargeAmount = Math.min(1.0, chargeAmount + 0.025);
        aimAngle = Math.atan2(mousePos.y - frog.y, mousePos.x - frog.x);
      }

      // Physics Integration
      if (!frog.onGround) {
        frog.vx *= DRAG;
        frog.vy += GRAVITY;
        frog.x += frog.vx;
        frog.y += frog.vy;

        // Visual squash/stretch easing back to normal
        frog.squash += (1.0 - frog.squash) * 0.1;

        // Check platform collisions (only landing from top)
        if (frog.vy > 0) {
          for (let p of platforms) {
            if (frog.x >= p.x - 8 && frog.x <= p.x + p.w + 8 &&
                frog.y + frog.radius >= p.y && frog.y - frog.vy + frog.radius <= p.y + 12) {
              frog.y = p.y - frog.radius;
              frog.vy = 0;
              frog.vx = 0;
              frog.onGround = true;
              frog.currentPlatform = p;
              frog.squash = 1.35; // Squash on impact
              break;
            }
          }
        }

        // Screen boundary bounce
        if (frog.x - frog.radius < 20) {
          frog.x = 20 + frog.radius;
          frog.vx = -frog.vx * 0.7;
        }
        if (frog.x + frog.radius > canvas.width - 20) {
          frog.x = canvas.width - 20 - frog.radius;
          frog.vx = -frog.vx * 0.7;
        }

        // Fall reset
        if (frog.y > canvas.height + 50) {
          frog.x = 140;
          frog.y = 400;
          frog.vx = 0;
          frog.vy = 0;
        }
      } else {
        frog.squash += (1.0 - frog.squash) * 0.15;
      }

      // Collect fireflies
      fireflies.forEach(f => {
        if (!f.collected) {
          const dist = Math.hypot(f.x - frog.x, f.y - frog.y);
          if (dist < frog.radius + 15) {
            f.collected = true;
            fliesCollected++;
          }
        }
      });

      if (fliesCollected === fireflies.length) {
        victoryModal.style.display = 'flex';
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clean in-canvas flies counter
      ctx.fillStyle = '#2dd4bf';
      ctx.font = '600 11px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`FLIES: ${fliesCollected}/${fireflies.length}`, canvas.width - 24, 24);

      // Background ambient grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Platforms
      platforms.forEach(p => {
        // Platform surface
        ctx.fillStyle = '#1e2430';
        ctx.fillRect(p.x, p.y, p.w, p.h);

        // Tech edge outline
        ctx.strokeStyle = '#2dd4bf';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        // Top friction strip
        ctx.fillStyle = 'rgba(45, 212, 191, 0.3)';
        ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, 3);
      });

      // Draw Fireflies
      fireflies.forEach((f, i) => {
        if (!f.collected) {
          ctx.save();
          const flicker = Math.sin(Date.now() / 150 + i) * 3;
          ctx.beginPath();
          ctx.arc(f.x, f.y, 8 + flicker, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(242, 166, 90, 0.2)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#f2a65a';
          ctx.fill();
          ctx.restore();
        }
      });

      // Draw Parabolic Prediction Trajectory Arc when charging
      if (charging) {
        const power = chargeAmount * MAX_POWER;
        const simVx = Math.cos(aimAngle) * power;
        const simVy = Math.sin(aimAngle) * power;
        const points = calculateTrajectory(frog.x, frog.y, simVx, simVy);

        ctx.save();
        ctx.strokeStyle = '#2dd4bf';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        points.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        // Target dot
        if (points.length > 0) {
          const last = points[points.length - 1];
          ctx.beginPath();
          ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#2dd4bf';
          ctx.fill();
        }
        ctx.restore();
      }

      // Draw Mechanical Frog
      ctx.save();
      ctx.translate(frog.x, frog.y);
      const scaleX = 1 / Math.sqrt(frog.squash);
      const scaleY = frog.squash;
      ctx.scale(scaleX, scaleY);

      // Frog Body
      ctx.fillStyle = '#2dd4bf';
      ctx.beginPath();
      ctx.ellipse(0, 0, frog.radius * 1.1, frog.radius * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Mechanical Eyes
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-7, -10, 5, 0, Math.PI * 2);
      ctx.arc(7, -10, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f2a65a';
      ctx.beginPath();
      ctx.arc(-7, -10, 2, 0, Math.PI * 2);
      ctx.arc(7, -10, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
