<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steven | Gameplay Programmer</title>
  <meta name="description" content="Steven, gameplay programmer. Drag a cartridge into the console and play each Unity game right in the browser." />
  <meta property="og:title" content="Steven | Gameplay Programmer" />
  <meta property="og:description" content="Pick a cartridge, slot it in, play the game. Unity and C# gameplay work, playable in the browser." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#ecebe6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind is only used for the icon size utilities (w-4 h-4) -->
  <script src="vendor/tailwind.js"></script>

  <script src="vendor/react.production.min.js" crossorigin></script>
  <script src="vendor/react-dom.production.min.js" crossorigin></script>
  <script src="vendor/babel.min.js"></script>

  <style>
    /* ------------------------------------------------------------------
       "Steven Pocket": an industrial-design object on a warm grey table.
       Bone shell, graphite cartridges, one signal orange.
       --accent / --bg are overwritten by portfolio-bridge.js from the
       editor's style settings.
       ------------------------------------------------------------------ */
    :root {
      --bg: #ecebe6;
      --shell: #f8f7f3;
      --shell-lo: #e4e2db;
      --graphite: #1d1d1c;
      --graphite-2: #2c2c2a;
      --ink: #151514;
      --ink-2: #62605a;
      --ink-3: #93908a;
      --rule: rgba(21,21,20,.1);
      --accent: #ff5a1f;
      --on-accent: #fff;
      --night: #121211;
      --night-ink: #f1f0eb;
      --night-ink-2: #9a9891;
      --night-rule: rgba(241,240,235,.12);

      --content-width: 760px; --body-size: 16px; --body-leading: 1.6; --block-gap: 40px; --content-align: left;

      --wrap: 1200px;
      --gutter: clamp(20px, 5vw, 56px);
      --cw: clamp(96px, 10vw, 138px);          /* cartridge width */
      --ch: calc(var(--cw) * 1.22);              /* cartridge height */
      --ease: cubic-bezier(.2,.8,.2,1);
      --ease-enter: cubic-bezier(.22,1,.36,1);
      --ease-io: cubic-bezier(.65,0,.35,1);
      --sans: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; scroll-padding-top: 64px; }
    html, body { background: var(--bg); }
    body { color: var(--ink); font-family: var(--sans); font-size: var(--body-size); line-height: var(--body-leading); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    ::selection { background: var(--accent); color: var(--on-accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    img { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; }

    .wrap { width: 100%; max-width: calc(var(--wrap) + var(--gutter) * 2); margin: 0 auto; padding: 0 var(--gutter); }
    .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
    .skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; }
    .skip:focus { top: 12px; }

    /* ---------- buttons ---------- */
    .btn { font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px;
      border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: transform 150ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
    .btn:active { transform: translateY(1px) scale(.985); transition-duration: 90ms; }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-accent { background: var(--accent); color: var(--on-accent); }
    .btn-ghost { background: transparent; border-color: color-mix(in srgb, currentColor 26%, transparent); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    @media (hover: hover) {
      .btn-primary:hover { background: color-mix(in srgb, var(--ink) 84%, var(--bg)); transform: translateY(-1px); }
      .btn-accent:hover { background: color-mix(in srgb, var(--accent) 86%, #000); transform: translateY(-1px); }
      .btn-ghost:hover { border-color: currentColor; transform: translateY(-1px); }
      .btn:disabled:hover { transform: none; }
    }
    .ul { color: inherit; text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size 300ms var(--ease); }
    .ul:hover { background-size: 100% 1px; }

    /* ---------- nav ---------- */
    .nav { position: sticky; top: 0; z-index: 50; transition: background-color 400ms var(--ease), box-shadow 400ms var(--ease), color 400ms var(--ease); }
    .nav.scrolled { background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 1px 0 var(--rule); }
    .nav.on-dark { --bg: var(--night); color: var(--night-ink); --rule: var(--night-rule); }
    .nav .wrap { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-weight: 650; font-size: 16px; letter-spacing: -.02em; color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
    .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 4px; }
    .nav nav ul { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
    .nav nav ul a { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; color: inherit; opacity: .6; text-decoration: none; transition: opacity 150ms var(--ease); }
    .nav nav ul a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 10px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform 300ms var(--ease); }
    .nav nav ul a:hover, .nav nav ul a[aria-current="true"] { opacity: 1; }
    .nav nav ul a:hover::after, .nav nav ul a[aria-current="true"]::after { transform: scaleX(1); transform-origin: left; }
    .sound { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; opacity: .6; transition: opacity 150ms var(--ease); }
    .sound:hover { opacity: 1; }

    /* ================================================================
       HERO: the console and the cartridge tray
       ================================================================ */
    .hero { min-height: calc(100svh - 60px); display: flex; flex-direction: column; padding: clamp(12px, 2vh, 28px) 0 clamp(28px, 5vh, 56px); }
    .hero-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
    .hero h1 { margin: 0; font-weight: 600; font-size: clamp(32px, 3.6vw, 52px); line-height: 1; letter-spacing: -.045em; max-width: 16ch; }
    @media (min-width: 900px) { .hero h1 { max-width: none; font-size: clamp(32px, 3vw, 44px); } }
    .hero h1 .soft { color: var(--ink-3); }
    .hero-meta { text-align: right; color: var(--ink-2); display: grid; gap: 6px; }
    .hero-meta b { color: var(--ink); font-weight: 500; }

    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3vh, 36px); margin-top: clamp(12px, 2vh, 24px); }

    /* the rig holds the seated cartridge behind the console body */
    .rig { position: relative; width: min(880px, 100%, calc((100svh - 400px) * 1.6)); padding-top: calc(var(--ch) * .44); }
    .cart.seated { position: absolute; left: 50%; top: 0; margin-left: calc(var(--cw) / -2); z-index: 0; visibility: hidden; }
    .cart.seated.on { visibility: visible; }

    .console { position: relative; z-index: 1; border-radius: clamp(28px, 5vw, 52px); padding: clamp(18px, 3.4vw, 34px) clamp(18px, 4vw, 40px) clamp(20px, 3.4vw, 32px);
      background: linear-gradient(180deg, var(--shell) 0%, var(--shell-lo) 100%);
      box-shadow: inset 0 1px 0 #fff, inset 0 -8px 18px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.06), 0 30px 60px -28px rgba(40,36,28,.42), 0 70px 120px -60px rgba(40,36,28,.35);
      display: grid; grid-template-columns: 1fr minmax(0, 3.2fr) 1fr; gap: clamp(14px, 3vw, 32px); align-items: center; }
    /* the slot is a groove cut into the top edge */
    .slot { position: absolute; top: 0; left: 50%; width: calc(var(--cw) + 22px); height: 16px; transform: translate(-50%, -50%); border-radius: 9px;
      background: linear-gradient(180deg, #0c0c0b, #272725); box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.9); transition: box-shadow 300ms var(--ease); z-index: 2; }
    .rig.armed .slot { box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px var(--accent), 0 0 28px 4px color-mix(in srgb, var(--accent) 45%, transparent); }
    .rig.thud .console { animation: thud 520ms var(--ease-enter); }
    @keyframes thud { 22% { transform: translateY(5px) scaleY(.99); } 55% { transform: translateY(-1.5px); } }
    .rig.thud .led { animation: ledflash 600ms var(--ease) both; }
    @keyframes ledflash { 0%, 40% { background: #fff; box-shadow: 0 0 18px 4px var(--accent); } }
    /* first-visit nudge: the slot breathes while a cartridge shows the way */
    .rig.hint .slot { animation: slotcall 1700ms var(--ease-io); }
    @keyframes slotcall { 35%, 60% { box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 24px 2px color-mix(in srgb, var(--accent) 35%, transparent); } }
    /* hovering a cartridge previews its art on the idle screen */
    .rig.peek .phase-idle .screen-art { opacity: .55; filter: blur(0) saturate(1); transform: none; }
    .rig.peek .phase-idle .screen-ui { text-shadow: 0 1px 14px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.5); }

    .face-top { position: absolute; top: clamp(14px, 2.2vw, 20px); left: clamp(22px, 4.4vw, 44px); right: clamp(22px, 4.4vw, 44px); display: flex; justify-content: space-between; color: var(--ink-3); pointer-events: none; }
    .power { display: inline-flex; align-items: center; gap: 8px; }
    .led { width: 7px; height: 7px; border-radius: 50%; background: #c9c6be; box-shadow: inset 0 1px 1px rgba(0,0,0,.25); transition: background-color 300ms var(--ease), box-shadow 300ms var(--ease); }
    .led.on { background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 2px var(--accent); }
    .led.busy { animation: blink 520ms steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    /* screen */
    .bezel { margin-top: clamp(14px, 2.2vw, 22px); padding: clamp(8px, 1.2vw, 12px); border-radius: clamp(12px, 1.8vw, 18px); background: var(--graphite); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.8); }
    .screen { --mx: 30%; --my: 20%; position: relative; aspect-ratio: 16 / 10; border-radius: clamp(6px, .9vw, 9px); overflow: hidden; background: #050505; color: #f3f2ee; isolation: isolate; }
    .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: inherit;
      background: radial-gradient(70% 60% at var(--mx) var(--my), rgba(255,255,255,.10), transparent 60%), linear-gradient(160deg, rgba(255,255,255,.06), transparent 40%); transition: background-position 200ms linear; }
    .screen-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .28; filter: blur(3px) saturate(.9); transform: scale(1.08);
      transition: opacity 700ms var(--ease-enter), filter 700ms var(--ease-enter), transform 900ms var(--ease-enter); }
    .phase-ready .screen-art, .phase-playing .screen-art { opacity: 1; filter: none; transform: none; }
    .phase-seating .screen-art, .phase-booting .screen-art, .phase-ejecting .screen-art { opacity: 0; }
    .screen-ui { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center; padding: 6%; }
    .screen-ui .mono { color: rgba(243,242,238,.62); }
    .screen-title { white-space: nowrap; margin: 10px 0 0; font-size: clamp(16px, 2.3vw, 30px); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; display: flex; align-items: center; gap: .5em; }
    .screen-title .chev { opacity: .45; font-weight: 400; }
    .screen-hint { margin-top: 12px; color: rgba(243,242,238,.62); font-size: clamp(11px, 1.2vw, 13px); }
    .swap { animation: swap 480ms var(--ease-enter); }
    .swap.l { --sx: -14px; }
    @keyframes swap { from { opacity: 0; transform: translateX(var(--sx, 14px)); filter: blur(4px); } }
    .armed-ring { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; margin: 0 auto 14px; animation: ring 1.1s var(--ease) infinite; }
    @keyframes ring { 50% { transform: scale(1.12); box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 18%, transparent); } }
    .boot { display: grid; justify-items: center; gap: 14px; animation: crt 560ms cubic-bezier(.2,.8,.2,1) both; }
    .boot small { font: 500 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(243,242,238,.55); animation: settle 600ms var(--ease-enter) both 450ms; }
    @keyframes crt { 0% { transform: scale(.7, .008); filter: brightness(4); opacity: 0; } 45% { transform: scale(1, .008); filter: brightness(3); opacity: 1; } 100% { transform: none; filter: none; } }
    .boot b { font-size: clamp(20px, 3.4vw, 38px); font-weight: 650; letter-spacing: -.04em; animation: bootname 900ms var(--ease-enter) both; }
    .boot i { display: block; width: clamp(80px, 14vw, 140px); height: 2px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
    .boot i::after { content: ""; display: block; height: 100%; background: var(--accent); transform-origin: left; animation: bootbar 1100ms var(--ease-io) both 150ms; }
    @keyframes bootname { from { opacity: 0; transform: translateY(-18px); filter: blur(6px); } }
    @keyframes bootbar { from { transform: scaleX(0); } }
    .screen-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 13px; animation: settle 600ms var(--ease-enter) both; }
    .screen-bar b { font-weight: 600; letter-spacing: -.01em; }
    .screen-bar span { display: inline-flex; gap: 14px; }
    .k { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; font: 600 10px var(--mono); background: rgba(255,255,255,.9); color: #111; }
    .k.a { background: var(--accent); color: #fff; }

    /* under-screen engraving */
    .engrave { display: flex; justify-content: center; align-items: baseline; gap: 10px; margin-top: clamp(10px, 1.6vw, 16px); color: var(--ink-3); }
    .engrave b { font-weight: 650; font-size: clamp(12px, 1.4vw, 15px); letter-spacing: .02em; color: #b5b2aa; font-style: italic; }
    .pills { display: flex; justify-content: center; gap: 14px; margin-top: clamp(10px, 1.6vw, 14px); }
    .pill { border: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; background: none; padding: 4px 6px; color: var(--ink-3); }
    .pill i { width: clamp(30px, 4vw, 40px); height: 9px; border-radius: 9px; background: #c7c4bc; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); transition: transform 90ms var(--ease); }
    .pill:active i { transform: translateY(1px); box-shadow: none; }

    /* d-pad: four arms that press one at a time */
    .dpad { --s: clamp(78px, 10vw, 112px); position: relative; width: var(--s); height: var(--s); justify-self: center; }
    .dpad::before { content: ""; position: absolute; inset: 33.3%; background: var(--graphite); }
    .dpad::after { content: ""; position: absolute; inset: 40%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3a3a37, #1d1d1c); }
    .arm { position: absolute; border: 0; padding: 0; cursor: pointer; background: linear-gradient(180deg, #333331, var(--graphite)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 0 #0b0b0a; transition: transform 90ms var(--ease), box-shadow 90ms var(--ease); }
    .arm:active, .arm.hit { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 0 #0b0b0a; }
    .arm.up { left: 33.3%; right: 33.3%; top: 0; height: 36%; border-radius: 6px 6px 0 0; }
    .arm.down { left: 33.3%; right: 33.3%; bottom: 0; height: 36%; border-radius: 0 0 6px 6px; }
    .arm.left { top: 33.3%; bottom: 33.3%; left: 0; width: 36%; border-radius: 6px 0 0 6px; }
    .arm.right { top: 33.3%; bottom: 33.3%; right: 0; width: 36%; border-radius: 0 6px 6px 0; }
    .arm::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border: 4px solid transparent; transform: translate(-50%, -50%); opacity: .35; }
    .arm.up::after { border-bottom-color: #fff; margin-top: -2px; }
    .arm.down::after { border-top-color: #fff; margin-top: 2px; }
    .arm.left::after { border-right-color: #fff; margin-left: -2px; }
    .arm.right::after { border-left-color: #fff; margin-left: 2px; }

    .ab { --b: clamp(40px, 5.2vw, 56px); position: relative; width: calc(var(--b) * 2.2); height: calc(var(--b) * 1.9); justify-self: center; }
    .ab button { position: absolute; width: var(--b); height: var(--b); border-radius: 50%; border: 0; cursor: pointer; font: 600 clamp(12px, 1.4vw, 15px) var(--mono); color: #fff;
      transition: transform 90ms var(--ease), box-shadow 90ms var(--ease); }
    .ab .a { right: 0; top: 0; background: radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent) 60%); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000), 0 10px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
    .ab .b { left: 0; bottom: 0; background: radial-gradient(circle at 40% 30%, #4a4a47, var(--graphite) 60%); box-shadow: 0 4px 0 #0b0b0a, 0 10px 18px -8px rgba(0,0,0,.5); }
    .ab button:active, .ab button.hit { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
    .ab small, .dpad small { position: absolute; font: 500 10px var(--mono); letter-spacing: .1em; color: var(--ink-3); }
    .ab .a + small { right: 0; width: var(--b); text-align: center; top: calc(var(--b) + 10px); }
    .ab .b + small { left: 0; width: var(--b); text-align: center; bottom: -22px; }
    .grille { position: absolute; right: clamp(22px, 4vw, 44px); bottom: clamp(16px, 2.4vw, 24px); width: 46px; height: 22px; opacity: .55;
      background: radial-gradient(circle, #a8a59d 1.3px, transparent 1.6px) 0 0 / 8px 8px; transform: rotate(-24deg); }

    /* ---------- cartridges ---------- */
    .tray { display: flex; justify-content: center; align-items: flex-start; gap: clamp(16px, 3vw, 40px); flex-wrap: wrap; }
    .slotitem { display: grid; justify-items: center; gap: 2px; }
    .cart { --pc: var(--accent); position: relative; width: var(--cw); height: var(--ch); border-radius: 12px 12px 7px 7px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y;
      background: linear-gradient(180deg, #353533 0%, var(--graphite) 55%, #161615 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.4), 0 2px 3px rgba(0,0,0,.18), 0 18px 28px -16px rgba(20,18,14,.55);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
      transition: transform 180ms var(--ease), box-shadow 180ms var(--ease); border: 0; padding: 0; display: block; color: inherit; }
    .cart:active { cursor: grabbing; }
    .cart .ridges { position: absolute; top: 8px; left: 18%; right: 18%; height: 9%; background: repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 2px, transparent 2px 6px); border-radius: 2px; }
    .cart .label { position: absolute; left: 9%; right: 9%; top: 18%; bottom: 13%; border-radius: 4px; overflow: hidden; background: #f4f3ee; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
    .cart .art { flex: 1; min-height: 0; background: #0f0f0e; }
    .cart .art img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .cart .art .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: calc(var(--cw) * .3); font-weight: 650; color: var(--pc); }
    .cart .print { padding: 6px 7px 7px; border-top: 3px solid var(--pc); text-align: left; }
    .cart .print b { display: block; font-size: clamp(10px, 1vw, 12.5px); font-weight: 650; letter-spacing: -.01em; color: #151514; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
    .cart .print span { display: block; font: 500 8.5px var(--mono); letter-spacing: .08em; color: #8b887f; margin-top: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart .notch { position: absolute; bottom: 5px; left: 9%; width: 18%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); }
    @media (hover: hover) { .tray .cart:hover { transform: translateY(-6px); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.4), 0 2px 3px rgba(0,0,0,.18), 0 30px 36px -18px rgba(20,18,14,.6); } }
    .tray .cart.selected { transform: translateY(-10px); }
    .cart-ghost { cursor: grabbing; will-change: transform; transition: none !important; }
    .cart-ghost.lifted { box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.4), 0 40px 50px -20px rgba(20,18,14,.55) !important; }
    .slotitem.out .cart { visibility: hidden; }
    .slotitem .gap { position: absolute; inset: 0; border-radius: 12px 12px 7px 7px; border: 1.5px dashed rgba(21,21,20,.18); opacity: 0; transition: opacity 300ms var(--ease); pointer-events: none; }

        <polygon points="12,4 4,14 20,14" />

      </svg>
    );

    const titleCase = (v='') => v.charAt(0).toUpperCase() + v.slice(1).toLowerCase();
    const sentenceCase = (v='') => v ? v.charAt(0).toUpperCase() + v.slice(1).toLowerCase() : '';
    const hasBuild = (p) => !!p && !(p.player?.mode === 'none' || (p.player?.mode !== 'sample' && !p.player?.url));
    const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const COARSE = window.matchMedia('(pointer: coarse)').matches;   // touch screens tap instead of drag
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const frames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const pad = (n) => String(n).padStart(2, '0');
    const SECTIONS = [
      { id: 'top', label: 'Cartridges' },
      { id: 'about', label: 'About' },
      { id: 'resume', label: 'Resume' },
      { id: 'contact', label: 'Contact' }
    ];

    // A damped spring sampled into a CSS linear() easing, so flights settle like a real object.
    const SPRING = (() => {
      const k = 210, c = 19, dt = 1 / 120, pts = [];
      let x = 0, v = 0;
      for (let i = 0; i < 108; i++) { v += (-k * (x - 1) - c * v) * dt; x += v * dt; if (i % 2 === 0) pts.push(+x.toFixed(4)); }
      pts.push(1);
      const ok = window.CSS?.supports?.('animation-timing-function', 'linear(0, 1)');
      return { easing: ok ? `linear(0, ${pts.join(', ')})` : 'cubic-bezier(.22,1,.36,1)', duration: 900 };
    })();

    const IconArrowUpRight = ({ className = "w-4 h-4" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    );

    // =========================================================================
    // 5. SCROLL: reveals and nav state
    // =========================================================================
    const useReveal = (dep) => {
      useEffect(() => {
        const els = [...document.querySelectorAll('[data-reveal]:not(.in)')];
        if (reduceMotion() || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(entries => entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        }), { rootMargin: '0px 0px -12% 0px' });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, [dep]);
    };

    const useNavState = () => {
      const [state, setState] = useState({ scrolled: false, onDark: false, active: '' });
      useEffect(() => {
        let raf = 0;
        const update = () => {
          raf = 0;
          const onDark = [...document.querySelectorAll('.night')].some(s => { const r = s.getBoundingClientRect(); return r.top <= 30 && r.bottom > 30; });
          let active = '';
          for (const { id } of SECTIONS) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= innerHeight * 0.4) active = id; }
          const scrolled = scrollY > 8;
          setState(s => (s.scrolled === scrolled && s.onDark === onDark && s.active === active) ? s : { scrolled, onDark, active });
        };
        const on = () => { if (!raf) raf = requestAnimationFrame(update); };
        update();
        addEventListener('scroll', on, { passive: true }); addEventListener('resize', on);
        return () => { cancelAnimationFrame(raf); removeEventListener('scroll', on); removeEventListener('resize', on); };
      }, []);
      return state;
    };

    // =========================================================================
    // 6. NAV
    // =========================================================================
    const Navbar = ({ scrolled, onDark, active, soundOn, onSound }) => {
      const [open, setOpen] = useState(false);
      useEffect(() => {
        if (!open) return;
        const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.documentElement.style.overflow = 'hidden';
        addEventListener('keydown', esc);
        return () => { document.documentElement.style.overflow = ''; removeEventListener('keydown', esc); };
      }, [open]);
      return (
        <header className={`nav ${scrolled ? 'scrolled' : ''} ${onDark && !open ? 'on-dark' : ''} ${open ? 'menu-open' : ''}`}>
          <div className="wrap">
            <a href="#top" className="brand" onClick={() => setOpen(false)}><i aria-hidden="true" />{titleCase(PORTFOLIO_DATA.header.name)}</a>
            <div className="nav-right">
              <nav aria-label="Sections">
                <ul>{SECTIONS.map(s => <li key={s.id}><a href={'#' + s.id} aria-current={active === s.id ? 'true' : undefined}>{s.label}</a></li>)}</ul>
              </nav>
              <button className="sound" onClick={onSound} aria-label={soundOn ? 'Mute sound' : 'Turn sound on'} aria-pressed={soundOn}>
                {soundOn ? <IconVolume2 className="w-4 h-4" /> : <IconVolumeX className="w-4 h-4" />}
              </button>
              <button className="menu-btn" aria-expanded={open} aria-controls="menu" aria-label={open ? 'Close the menu' : 'Open the menu'} onClick={() => setOpen(o => !o)}>
                <i /><i />
              </button>
            </div>
          </div>
          <div id="menu" className="menu" hidden={!open}>
            <ul>{SECTIONS.map((s, i) => <li key={s.id} style={{ '--i': i }}><a href={'#' + s.id} onClick={(e) => {
              // the open menu locks scrolling, so close it first and scroll on the next frame
              e.preventDefault(); setOpen(false);
              document.documentElement.style.overflow = '';
              requestAnimationFrame(() => document.getElementById(s.id)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }));
            }}>{s.label}</a></li>)}</ul>

        </header>

    const Screen = ({ phase, project, index, total, dir, screenRef }) => {
      const playable = hasBuild(project);

      if (phase === 'idle' && project) ui = (

      if (phase === 'armed') ui = (
        <div className="swap"><div className="armed-ring"><IconEject className="w-4 h-4 rotate-180" /></div><p className="screen-title" style={{ justifyContent: 'center' }}>Let go to insert</p></div>

      if (phase === 'booting') ui = (
        <div className="boot"><b>{titleCase(PORTFOLIO_DATA.header.name)}</b><i /><small>Loading {project?.title}</small></div>

    // =========================================================================
    // 9. HERO: console, slot, tray

    const Hero = ({ projects, sel, dir, phase, seated, rigRef, slotRef, seatRef, screenRef, cartRefs, outIds, onCartPointerDown, onCartClick, onCartEnter, peek, onPad, onA, onB }) => {
      const { header } = PORTFOLIO_DATA;
      const shown = seated || projects[sel];
      const playable = projects.filter(hasBuild).length;
      const sheen = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        screenRef.current?.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        screenRef.current?.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
      };
      return (
        <section className="hero" id="top" aria-label="Console">
          <div className="wrap" style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>

            <div className="stage">

                <div className="cart seated" ref={seatRef} style={{ '--pc': seated?.accentColor }} aria-hidden="true">
                  {seated && <CartFace project={seated} />}

                <div className="console">
                  <span className="slot" ref={slotRef} aria-hidden="true" />

                  <div className="dpad">

                    <button className="arm down" aria-label="Next cartridge" onClick={() => onPad(1)} />
                  </div>

                  <div className="screen-col">
                    <div className="bezel">
                      <Screen phase={phase} project={shown} index={seated ? projects.indexOf(seated) : sel} total={projects.length} dir={dir} screenRef={screenRef} />

                    <div className="pills">
                      <button className="pill mono" onClick={() => onPad(1)}><i />Select</button>
                      <button className="pill mono" onClick={onA}><i />Start</button>
                    </div>
                  </div>

                  <div className="ab">
                    <button className="a" onClick={onA} aria-label={seated ? `Play ${seated.title}` : `Insert ${shown?.title || 'cartridge'}`}>A</button>
                    <small>{seated ? 'Play' : 'Insert'}</small>
                    <button className="b" onClick={onB} aria-label="Eject the cartridge" disabled={!seated}>B</button>
                    <small>Eject</small>
                  </div>
                  <span className="grille" aria-hidden="true" />
                </div>
              </div>

              <div className="tray" role="list" aria-label="Cartridges">
                {projects.map((p, i) => (
                  <div key={p.id} role="listitem" className={`slotitem ${outIds.includes(p.id) ? 'out' : ''} ${i === sel && !seated ? 'is-sel' : ''}`} style={{ '--i': i, '--r': (i % 2 ? 4 : -4) + 'deg' }}>

                        className={`cart ${i === sel && !seated ? 'selected' : ''}`}

                <li key={i} data-reveal>
                  <div className="when mono">{exp.period}</div>
                  <div className="what"><h3>{exp.role}</h3><p>{exp.company}</p></div>
                  <ul>{exp.highlights.map((b, j) => <li key={j}>{b}</li>)}</ul>
                </li>
              ))}
            </ol>
            {resume.education?.length > 0 && (
              <>
                <p className="mono label sub-head" data-reveal>Education</p>
                <ol className="rows">
                  {resume.education.map((edu, i) => (
                    <li key={i} data-reveal>
                      <div className="when mono">{edu.period}</div>
                      <div className="what"><h3>{edu.degree}</h3><p>{edu.school}</p></div>
                    </li>
                  ))}
                </ol>
              </>
            )}
          </div>
        </section>
      );
    };

    const ContactView = () => {
      const { contact, header } = PORTFOLIO_DATA;
      const [copied, setCopied] = useState(false);
      const copy = () => navigator.clipboard?.writeText(contact.email).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
      return (
        <section className="section night contact" id="contact" style={{ paddingBottom: 0 }}>
          <div className="wrap">
            <p className="mono label" data-reveal>Contact</p>
            <h2 className="h2" data-reveal style={{ '--d': 1 }}>Player two,<br />press start.</h2>
            <p className="lede" data-reveal style={{ '--d': 2 }}>Open to gameplay programming roles, internships and co-op projects.</p>
            <div className="email-row" data-reveal style={{ '--d': 3 }}>
              <a className="email-link" href={'mailto:' + contact.email}>{contact.email}</a>
              <button onClick={copy} className="btn btn-ghost" aria-live="polite">
                {copied ? <><IconCheck className="w-4 h-4" />Copied</> : <><IconCopy className="w-4 h-4" />Copy the address</>}
              </button>
            </div>
            {contact.links.length > 0 && (
              <ul className="links">
                {contact.links.map((link, i) => (
                  <li key={i} data-reveal style={{ '--d': i }}>
                    <a href={link.url} target="_blank" rel="noopener noreferrer">{link.label}
                      <span>{link.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}<IconArrowUpRight className="w-4 h-4" /></span>
                    </a>
                  </li>
                ))}
              </ul>
            )}
            <footer className="foot">
              <span>© {new Date().getFullYear()} {titleCase(header.name)}</span>
              <a href="#top" className="ul">Back to the console</a>
            </footer>
          </div>
        </section>
      );
    };

    // =========================================================================
    // 13. ROOT APP: the cartridge state machine
    //     idle -> (drag) armed -> seating -> booting -> ready -> playing
    //     ready -(B)-> ejecting -> idle
    // =========================================================================
    const App = () => {
      const [version, refreshProfile] = useState(0);
      const [sel, setSel] = useState(0);
      const [dir, setDir] = useState(1);
      const [phase, setPhase] = useState('idle');
      const [seatedId, setSeatedId] = useState(null);
      const [outIds, setOutIds] = useState([]);
      const [activeProject, setActiveProject] = useState(null);
      const [isArcadeOpen, setIsArcadeOpen] = useState(false);
      const [techDetailProject, setTechDetailProject] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const nav = useNavState();
      useReveal(version);

      const rigRef = useRef(null), slotRef = useRef(null), seatRef = useRef(null), screenRef = useRef(null);
      const cartRefs = useRef({});
      const busy = useRef(false);
      const seatedRef = useRef(null);       // mirrors seatedId for async code
      const dragged = useRef(false);        // swallows the click that ends a drag
      const detailFrom = useRef(null);      // the cartridge the detail panel grows out of
      const touched = useRef(false);        // any interaction cancels the first-visit nudge
      const [peek, setPeek] = useState(false);

      const projects = PORTFOLIO_DATA.games.filter(p => !p.hidden);
      const seated = projects.find(p => p.id === seatedId) || null;
      const out = (id, on) => setOutIds(ids => on ? [...new Set([...ids, id])] : ids.filter(x => x !== id));

      // The editor previews this page in an iframe and pushes config updates.
      useEffect(() => {
        const handle = e => {
          if (e.origin !== location.origin || e.source !== window.parent || window.parent === window || e.data.type !== 'portfolio-update') return;
          document.querySelector('.arcade-screen iframe')?.contentWindow?.postMessage({ type: 'unity-quit' }, location.origin);
          document.querySelectorAll('.cart-ghost,.zoom').forEach(n => n.remove());
          seatRef.current?.classList.remove('on');
          busy.current = false; seatedRef.current = null;
          setActiveProject(null); setIsArcadeOpen(false); setSeatedId(null); setOutIds([]); setPhase('idle');
          applyProfile(e.data.config);
          const target = { games: 'top', about: 'about', resume: 'resume', contact: 'contact' }[e.data.tab];
          if (target) document.getElementById(target)?.scrollIntoView({ behavior: 'smooth' });
          if (e.data.projectId) setTechDetailProject(PORTFOLIO_DATA.games.find(p => p.id === e.data.projectId) || null);
          else if (e.data.tab === 'games') setTechDetailProject(null);
          refreshProfile(n => n + 1);
        };
        addEventListener('message', handle);
        if (window.parent !== window) window.parent.postMessage({ type: 'portfolio-ready', original: ORIGINAL_PROFILE }, location.origin);
        return () => removeEventListener('message', handle);
      }, []);

      // The entrance plays once a visit; drop the class so later renders never replay it.
      useEffect(() => { const t = setTimeout(() => document.documentElement.classList.remove('enter'), 2200); return () => clearTimeout(t); }, []);

      // ---- flight helpers ---------------------------------------------------
      const ghostOf = (el, rect) => {
        const r = rect || el.getBoundingClientRect();
        const g = el.cloneNode(true);
        g.classList.remove('seated', 'on', 'selected');
        g.classList.add('cart-ghost');
        g.removeAttribute('tabindex'); g.setAttribute('aria-hidden', 'true');
        Object.assign(g.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', margin: 0, zIndex: 70, pointerEvents: 'none', visibility: 'visible', transform: 'none' });
        document.body.appendChild(g);
        return g;
      };
      // Moves a ghost from where it is now (pos) to a viewport point, then resolves.
      const fly = (g, pos, to, { arc = 0, easing = SPRING.easing, duration = SPRING.duration } = {}) => {
        g.style.left = to.left + 'px'; g.style.top = to.top + 'px';
        const dx = pos.left - to.left, dy = pos.top - to.top, rot = pos.rot || 0;
        const kf = [{ transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${pos.scale || 1})` }];
        if (arc) kf.push({ transform: `translate(${dx / 2}px, ${dy / 2 - arc}px) rotate(${rot / 3 - 3}deg) scale(1.04)`, offset: .5 });
        kf.push({ transform: 'none' });
        g.style.transform = 'none';
        if (reduceMotion()) return Promise.resolve();
        return g.animate(kf, { duration, easing }).finished.catch(() => {});
      };

      // ---- insert / boot / play / eject -------------------------------------
      const zoomToPlayer = async (p) => {
        if (!hasBuild(p)) { setTechDetailProject(p); return; }
        const s = screenRef.current?.getBoundingClientRect();
        const w = Math.min(1100, innerWidth - 48), h0 = w * 9 / 16, h = Math.min(h0, innerHeight * .72), W = h < h0 ? h * 16 / 9 : w;
        const L = (innerWidth - W) / 2, T = (innerHeight - h) / 2 + 10;
        if (s && !reduceMotion()) {
          const z = document.createElement('div');
          z.className = 'zoom';
          Object.assign(z.style, { left: L + 'px', top: T + 'px', width: W + 'px', height: h + 'px', backgroundImage: p.coverImage ? `url("${p.coverImage}")` : 'none' });
          document.body.appendChild(z);
          await z.animate([
            { transform: `translate(${s.left - L}px, ${s.top - T}px) scale(${s.width / W}, ${s.height / h})`, borderRadius: '30px' },
            { transform: 'none', borderRadius: '8px' }
          ], { duration: 720, easing: 'cubic-bezier(.7,0,.2,1)' }).finished.catch(() => {});
          document.documentElement.classList.add('from-zoom');
          setActiveProject(p); setIsArcadeOpen(true); setPhase('playing');
          await wait(60);
          await z.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' }).finished.catch(() => {});
          z.remove();
          setTimeout(() => document.documentElement.classList.remove('from-zoom'), 400);
        } else {
          setActiveProject(p); setIsArcadeOpen(true); setPhase('playing');
        }
      };

      const eject = async () => {
        const id = seatedRef.current, seat = seatRef.current, home = cartRefs.current[id];
        if (!id || !seat) return;
        soundManager.playEject();
        setPhase('ejecting');
        const D = seat.offsetHeight * .56;
        if (!reduceMotion()) await seat.animate([{ transform: 'none' }, { transform: `translateY(${-D - 18}px)` }], { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' }).finished.catch(() => {});
        const r = seat.getBoundingClientRect();
        const g = ghostOf(seat, r);
        seat.classList.remove('on');
        seat.getAnimations().forEach(a => a.cancel());
        seatedRef.current = null; setSeatedId(null);
        const to = home.getBoundingClientRect();
        await fly(g, { left: r.left, top: r.top }, { left: to.left, top: to.top }, { arc: 50 });
        g.remove(); out(id, false);
        if (!reduceMotion()) home.parentElement?.animate([{ transform: 'translateY(-10px)' }, { transform: 'translateY(2px)', offset: .6 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
        setPhase('idle');
      };

      // pos: where the cartridge starts (a dragged ghost's spot), else its tray spot
      const insert = async (p, ghost = null, pos = null) => {
        if (busy.current && !ghost) return;
        busy.current = true;
        try {
          if (seatedRef.current === p.id) { ghost?.remove(); await zoomToPlayer(p); return; }
          if (seatedRef.current) await eject();
          const el = cartRefs.current[p.id];
          if (!ghost) { pos = el.getBoundingClientRect(); ghost = ghostOf(el, pos); }
          out(p.id, true);
          setSel(projects.indexOf(p));
          seatedRef.current = p.id; setSeatedId(p.id); setPhase('seating');
          await frames();
          const seat = seatRef.current;
          seat.classList.remove('on');
          const rest = seat.getBoundingClientRect(), D = rest.height * .56;
          const dist = Math.hypot(pos.left - rest.left, pos.top - (rest.top - D));
          await fly(ghost, pos, { left: rest.left, top: rest.top - D }, { arc: Math.min(110, dist * .3), easing: 'cubic-bezier(.65,0,.35,1)', duration: Math.min(780, 380 + dist * .5) });
          ghost.remove();
          seat.classList.add('on');
          soundManager.playCartridgeInsert();
          if (!reduceMotion()) {
            await seat.animate([{ transform: `translateY(${-D}px)` }, { transform: 'translateY(5px)', offset: .72 }, { transform: 'none' }], { duration: 440, easing: 'cubic-bezier(.55,0,.2,1)' }).finished.catch(() => {});
            rigRef.current.classList.remove('thud'); void rigRef.current.offsetWidth; rigRef.current.classList.add('thud');
          }
          setPhase('booting');
          soundManager.playConsoleBoot();
          await wait(reduceMotion() ? 0 : 1350);
          setPhase('ready');
          await wait(reduceMotion() ? 0 : 420);
          await zoomToPlayer(p);
        } finally { busy.current = false; }
      };

      // ---- drag with the mouse or a pen (touch taps instead) -----------------
      const onCartPointerDown = (e, p) => {
        if (e.pointerType === 'touch' || e.button !== 0 || busy.current) return;
        const el = e.currentTarget, r = el.getBoundingClientRect();
        const st = { x: e.clientX, y: e.clientY, lastX: e.clientX, tx: 0, ty: 0, rot: 0, m: 0, ghost: null, armed: false };
        dragged.current = false;
        const move = (ev) => {
          if (!st.ghost) {
            if (Math.hypot(ev.clientX - st.x, ev.clientY - st.y) < 6) return;
            st.ghost = ghostOf(el, r); st.ghost.classList.add('lifted');
            dragged.current = true; out(p.id, true); soundManager.playCartridgeHover();
            el.closest('.tray')?.classList.add('dragging');
          }
          const rx = ev.clientX - st.x, ry = ev.clientY - st.y;
          const s = slotRef.current.getBoundingClientRect();
          const cx = r.left + rx + r.width / 2, cy = r.top + ry + r.height / 2;
          const armed = Math.abs(cx - (s.left + s.width / 2)) < s.width * 1.1 && cy > s.top - r.height * 1.3 && cy < s.top + r.height * 1.1;
          if (armed !== st.armed) { st.armed = armed; setPhase(armed ? 'armed' : (seatedRef.current ? 'ready' : 'idle')); }
          // Near the slot the cartridge is pulled upright and over the opening, like a magnet.
          st.m += ((armed ? 1 : 0) - st.m) * .25;
          const sx = s.left + s.width / 2 - r.width / 2 - r.left, sy = s.top - r.height * .7 - r.top;
          st.tx = rx + (sx - rx) * .45 * st.m; st.ty = ry + (sy - ry) * .25 * st.m;
          st.rot += (Math.max(-9, Math.min(9, (ev.clientX - st.lastX) * .7)) * (1 - st.m) - st.rot) * .22;
          st.lastX = ev.clientX;
          st.ghost.style.transform = `translate(${st.tx}px, ${st.ty}px) rotate(${st.rot}deg) scale(1.05)`;
        };
        const up = () => {
          removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
          el.closest('.tray')?.classList.remove('dragging');
          if (!st.ghost) return;
          const pos = { left: r.left + st.tx, top: r.top + st.ty, rot: st.rot, scale: 1.05 };
          if (st.armed) { busy.current = true; insert(p, st.ghost, pos); }
          else {
            setPhase(seatedRef.current ? 'ready' : 'idle');
            fly(st.ghost, pos, { left: r.left, top: r.top }).then(() => { st.ghost.remove(); out(p.id, false); });
          }
        };
        addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
      };
      const onCartClick = (p, el) => {
        if (dragged.current) { dragged.current = false; return; }
        soundManager.playClick();
        // select it too, so A plays the cart you just read (touch has no hover to do this)
        const i = projects.indexOf(p);
        if (!seatedRef.current && i !== sel) { setDir(i > sel ? 1 : -1); setSel(i); }
        detailFrom.current = el;
        setTechDetailProject(p);
      };
      const onCartEnter = (i) => {
        if (i < 0) { setPeek(false); return; }
        touched.current = true;
        if (busy.current || seatedRef.current) return;
        if (i !== sel) { setDir(i > sel ? 1 : -1); setSel(i); }
        setPeek(true);
      };

      // ---- detail panel grows out of the cartridge that was clicked, and shrinks back into it
      const fromRect = (el) => {
        const c = detailFrom.current?.getBoundingClientRect(), r = el.getBoundingClientRect();
        if (!c || !c.width) return null;
        return `translate(${c.left + c.width / 2 - (r.left + r.width / 2)}px, ${c.top + c.height / 2 - (r.top + r.height / 2)}px) scale(${c.width / r.width}, ${c.height / r.height})`;
      };
      useEffect(() => {
        if (!techDetailProject || reduceMotion()) return;
        const el = document.querySelector('.project-detail'), t = el && fromRect(el);
        if (!t) return;
        el.animate([{ transform: t, opacity: 0, borderRadius: '40px' }, { opacity: 1, offset: .35 }, { transform: 'none', opacity: 1, borderRadius: '24px' }],
          { duration: 620, easing: SPRING.easing });
      }, [techDetailProject]);
      const closeDetail = async () => {
        const el = document.querySelector('.project-detail'), t = el && !reduceMotion() && fromRect(el);
        if (t) {
          document.querySelector('.project-overlay')?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
          await el.animate([{ transform: 'none', opacity: 1 }, { opacity: 1, offset: .6 }, { transform: t, opacity: 0 }],
            { duration: 380, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished.catch(() => {});
        }
        detailFrom.current = null;
        setTechDetailProject(null);
      };

      // First visit: if nobody has touched anything after a few seconds, a cartridge shows the way to the slot once.
      useEffect(() => {
        if (COARSE || reduceMotion()) return;
        const stop = () => { touched.current = true; };
        const evs = ['pointerdown', 'keydown', 'wheel'];
        evs.forEach(e => addEventListener(e, stop, { passive: true }));
        const t = setTimeout(async () => {
          const p = projects[sel], el = p && cartRefs.current[p.id], box = el?.parentElement, slot = slotRef.current;
          if (touched.current || busy.current || seatedRef.current || scrollY > 80 || !box || !slot) return;
          const c = el.getBoundingClientRect(), s = slot.getBoundingClientRect();
          const dx = (s.left + s.width / 2 - (c.left + c.width / 2)) * .16, dy = (s.top - c.top) * .16;
          rigRef.current.classList.add('hint');
          await box.animate([
            { transform: 'none' },
            { transform: `translate(${dx}px, ${dy}px) rotate(-4deg) scale(1.04)`, offset: .4 },
            { transform: `translate(${dx}px, ${dy * 1.1}px) rotate(-3deg) scale(1.04)`, offset: .6 },
            { transform: 'none' }
          ], { duration: 1700, easing: 'cubic-bezier(.45,0,.2,1)' }).finished.catch(() => {});
          rigRef.current?.classList.remove('hint');
        }, 4200);
        return () => { clearTimeout(t); evs.forEach(e => removeEventListener(e, stop)); };
      }, []);

      // ---- console buttons ----------------------------------------------------
      const onPad = (step) => {
        if (busy.current || seatedRef.current || !projects.length) return;
        soundManager.playClick();
        setDir(step); setSel(s => (s + step + projects.length) % projects.length);
      };
      const onA = () => {
        if (busy.current) return;
        soundManager.playClick();
        if (seated) { busy.current = true; zoomToPlayer(seated).finally(() => { busy.current = false; }); }
        else if (projects[sel]) insert(projects[sel]);
      };
      const onB = async () => {
        if (busy.current || !seatedRef.current) return;
        busy.current = true; try { await eject(); } finally { busy.current = false; }
      };
      // From the spec sheets: glide back up to the console first.
      const insertFromSheet = async (p) => {
        if (busy.current) return;
        scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
        for (let t = 0; t < 40 && scrollY > 2; t++) await wait(50);
        await wait(120);
        insert(p);
      };

      // Arrow keys work the d-pad while the console is on screen.
      useEffect(() => {
        const key = (e) => {
          if (isArcadeOpen || techDetailProject || scrollY > innerHeight * .6 || /input|textarea/i.test(e.target.tagName)) return;
          if (e.key === 'ArrowLeft') onPad(-1);
          if (e.key === 'ArrowRight') onPad(1);
        };
        addEventListener('keydown', key);
        return () => removeEventListener('keydown', key);
      });

      const closePlayer = () => { setActiveProject(null); setIsArcadeOpen(false); setPhase(seatedRef.current ? 'ready' : 'idle'); };

      return (
        <>
          <a className="skip" href="#about">Skip to About</a>
          <Navbar {...nav} soundOn={soundOn} onSound={() => setSoundOn(soundManager.toggleSound())} />
          <main>
            <Hero projects={projects} sel={Math.min(sel, Math.max(0, projects.length - 1))} dir={dir} phase={phase} seated={seated}
              rigRef={rigRef} slotRef={slotRef} seatRef={seatRef} screenRef={screenRef} cartRefs={cartRefs} outIds={outIds}
              onCartPointerDown={onCartPointerDown} onCartClick={onCartClick} onCartEnter={onCartEnter} peek={peek && phase === 'idle'}
              onPad={onPad} onA={onA} onB={onB} />
            <AboutView />
            <ResumeView />
            <ContactView />
          </main>

          <GameplayArcadeModal project={activeProject} isOpen={isArcadeOpen} onCloseAndEject={closePlayer} />
          <ProjectDetailModal
            project={techDetailProject}
            onClose={closeDetail}
            onPlayDemo={(p) => { detailFrom.current = null; setTechDetailProject(null); insertFromSheet(p); }}
          />
        </>
      );
    };

    if (!reduceMotion()) document.documentElement.classList.add('enter');
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
