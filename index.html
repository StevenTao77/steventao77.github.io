      for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
      if (extractionZone.active) {
        ctx.beginPath(); ctx.arc(extractionZone.x, extractionZone.y, extractionZone.radius, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(242,166,90,0.15)'; ctx.fill(); ctx.strokeStyle = '#f2a65a'; ctx.stroke();
      }

      dataCores.forEach((c, i) => {
        if (!c.collected) {
          ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI*2); ctx.fillStyle = '#f2a65a'; ctx.fill();

    // =========================================================================
    // 6. CARTRIDGE COMPONENT (With Pure Blank Empty Groove)
    // =========================================================================
    const Cartridge = ({
      project,
      isInserted,
      isInserting,
      isDragging,
      onDragStart,
      onDragEnd,
      onOpenDetails,
      index
    }) => {
      const isDraggingRef = useRef(false);
      const startPosRef = useRef(null);
      const dragDistanceRef = useRef(0);

      const accent = project.accentColor || '#F2A65A';
      const code = project.cartridgeCode || `${project.title.substring(0, 3).toUpperCase()}-0${index + 1}`;

      const handleMouseDown = (e) => {
        startPosRef.current = { x: e.clientX, y: e.clientY };
        dragDistanceRef.current = 0;
      };

      const handleMouseMove = (e) => {
        if (startPosRef.current) {
          dragDistanceRef.current = Math.hypot(e.clientX - startPosRef.current.x, e.clientY - startPosRef.current.y);
        }
      };

      const handleDragStart = (e) => {
        e.stopPropagation();
        // Always snapshot the cartridge, even when the pointer starts over its artwork.
        const cartridge = e.currentTarget;
        const bounds = cartridge.getBoundingClientRect();
        e.dataTransfer.setDragImage(
          cartridge,
          Math.max(0, Math.min(bounds.width, e.clientX - bounds.left)),
          Math.max(0, Math.min(bounds.height, e.clientY - bounds.top))
        );
        isDraggingRef.current = true;
        soundManager.playCartridgeHover();
        e.dataTransfer.setData('text/plain', project.id);
        e.dataTransfer.setData('application/json', JSON.stringify({ projectId: project.id }));
        e.dataTransfer.effectAllowed = 'copyMove';
        window.__draggedCartridgeId = project.id;
        setTimeout(() => {
          onDragStart(project.id);
        }, 0);
      };

      const handleDragEnd = () => {
        window.__draggedCartridgeId = undefined;
        isDraggingRef.current = false;
        startPosRef.current = null;
        dragDistanceRef.current = 0;
        onDragEnd();
      };

      const handleClick = (e) => {
        e.stopPropagation();
        if (isDraggingRef.current || dragDistanceRef.current > 8) return;
        if (isInserted || isInserting || isDragging) return;
        soundManager.playClick();
        onOpenDetails(project);
      };

      // EMPTY SLOT PLACEHOLDER: Purely blank subtle recessed groove when cartridge is out (NO text, NO buttons!)
      if (isInserted || isInserting || isDragging) {
        return (
          <div 
            draggable={isDragging}
            onDragEnd={handleDragEnd}
            className="w-36 sm:w-44 h-52 sm:h-56 rounded-xl bg-black/30 border border-white/5 select-none shadow-inner"
          />
        );
      }

      return (
        <div
          draggable={!isInserting}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onDragStart={handleDragStart}
          onDragEnd={handleDragEnd}
          onClick={handleClick}
          onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handleClick(e);}}}
          tabIndex={0}
          role="button"
          aria-label={`Cartridge: ${project.title}. Drag into dock to play, or click for details.`}
          className={`group relative w-36 sm:w-44 h-52 sm:h-56 rounded-xl select-none cursor-grab active:cursor-grabbing transition-all duration-300 transform-gpu
            hover:-translate-y-3.5 hover:shadow-[0_16px_36px_rgba(242,166,90,0.35)] hover:border-[#F2A65A]/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#F2A65A]
            bg-gradient-to-b from-[#282b35] via-[#1c1f26] to-[#131518] border border-white/12 shadow-[0_12px_28px_rgba(0,0,0,0.75)]
            ${isInserting ? 'opacity-50 scale-95 pointer-events-none' : ''}
          `}
        >
          {/* 3D Top Bevel Highlight */}
          <div className="absolute inset-x-0 top-0 h-[2px] bg-white/20 rounded-t-xl" />

          {/* Top Gripper Ridges */}
          <div className="absolute top-2 inset-x-3 h-3 flex items-center justify-between px-1.5 opacity-60">
            <div className="w-1.5 h-1.5 rounded-full bg-black/60 shadow-inner" />
            <div className="flex-1 mx-2 h-1 bg-black/40 rounded-full flex gap-1 justify-center items-center">
              <div className="w-3.5 h-0.5 bg-white/20 rounded-full" />
              <div className="w-3.5 h-0.5 bg-white/20 rounded-full" />
              <div className="w-3.5 h-0.5 bg-white/20 rounded-full" />
            </div>
            <div className="w-1.5 h-1.5 rounded-full bg-black/60 shadow-inner" />
          </div>

          {/* Cartridge Cover Sticker Inset */}
          <div className="absolute inset-x-2.5 top-7 bottom-6 rounded-lg bg-[#0e1013] border border-white/10 p-2.5 flex flex-col justify-between overflow-hidden shadow-inner">
            <div className="flex items-center justify-between border-b border-white/10 pb-1.5 text-[9px] font-mono">
              <span className="text-[#F2A65A] font-bold tracking-widest uppercase">
                {code}
              </span>
              <span className="text-gray-400 font-medium">
                64-BIT
              </span>
            </div>

            <div className="relative my-auto flex flex-col items-center justify-center py-2 text-center">
              <div 
                className="w-12 h-12 rounded-full flex items-center justify-center mb-2 shadow-lg group-hover:scale-110 transition-transform duration-300"
                style={{ 
                  backgroundColor: `${accent}25`,
                  border: `2px solid ${accent}`
                }}
              >
                {project.coverImage ? <img src={project.coverImage} alt="" draggable={false} className="w-full h-full object-cover rounded-full pointer-events-none" /> : <IconDisc className="w-6 h-6 animate-spin-slow" style={{ color: accent }} />}
              </div>

              <h3 className="font-extrabold text-sm sm:text-base text-white tracking-wider uppercase font-mono drop-shadow-md">
                {project.title}
              </h3>
              <p className="text-[9px] sm:text-[10px] text-gray-400 font-mono mt-0.5 line-clamp-1">
                {project.subtitle}
              </p>
            </div>

            <div className="flex items-center justify-between border-t border-white/10 pt-1 text-[8px] font-mono text-gray-400">
              <span className="truncate max-w-[80px]">
                {project.techTags[0] || 'UNITY'}
              </span>
              <span className="text-gray-400">DRAG ME ↓</span>
            </div>
          </div>

          {/* Bottom Gold Contacts Strip (3D Edge) */}
          <div className="absolute bottom-1 inset-x-4 h-2 rounded-sm bg-gradient-to-r from-amber-700 via-yellow-500 to-amber-700 opacity-70 flex justify-around items-center px-1">
            <div className="w-1 h-full bg-black/40" />
            <div className="w-1 h-full bg-black/40" />
            <div className="w-1 h-full bg-black/40" />
            <div className="w-1 h-full bg-black/40" />
            <div className="w-1 h-full bg-black/40" />
          </div>
        </div>
      );
    };

    // =========================================================================

    const CartridgeShowcase = ({

    // =========================================================================
    // 8. COMPACT CONSOLE DOCK (Drop Target)
    // =========================================================================
    const CompactConsoleDock = ({
      projects,
      activeProject,
      onMountAndLaunch,
      onEject,
      isBooting,
      bootingProject
    }) => {
      const [isDragOver, setIsDragOver] = useState(false);

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        if (!isDragOver) setIsDragOver(true);
      };

      const handleDragEnter = (e) => {
        e.preventDefault();
        setIsDragOver(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        const rect = e.currentTarget.getBoundingClientRect();
        if (e.clientX <= rect.left || e.clientX >= rect.right || e.clientY <= rect.top || e.clientY >= rect.bottom) {
          setIsDragOver(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);

        let droppedId = e.dataTransfer.getData('text/plain');
        if (!droppedId) {
          try {
            const json = JSON.parse(e.dataTransfer.getData('application/json'));
            droppedId = json.projectId;
          } catch {
            droppedId = window.__draggedCartridgeId || '';
          }
        }

        if (droppedId) {
          const targetProj = projects.find(p => p.id === droppedId);
          if (targetProj) {
            onMountAndLaunch(targetProj);
          }
        }
      };

      const currentCartridge = bootingProject || activeProject;

      return (
        <div className="w-full max-w-xl mx-auto flex flex-col items-center mt-6 select-none">
          {/* Floating Pill Tooltip */}
          <div className="relative mb-3 flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#20232b] border border-[#F2A65A]/40 text-xs font-mono text-gray-200 shadow-[0_4px_16px_rgba(242,166,90,0.15)] animate-bounce">

            <span>Drag cartridge here to play</span>
          </div>

          {/* Tactile Hardware Console Slot Dock */}
          <div className="relative w-full rounded-3xl bg-gradient-to-b from-[#252830] via-[#1c1f26] to-[#131518] border-2 border-[#2f333f] shadow-[0_20px_50px_rgba(0,0,0,0.85)] p-5 sm:p-6 overflow-visible">
            <div className="relative z-10 flex flex-col items-center">
              <div
                onDragOver={handleDragOver}
                onDragEnter={handleDragEnter}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                className={`relative w-full h-24 rounded-2xl bg-[#090b0e] border-2 transition-all duration-200 p-2 flex items-center justify-center shadow-inner overflow-visible cursor-default
                  ${isDragOver 
                    ? 'border-[#F2A65A] bg-[#1a1710] shadow-[0_0_35px_rgba(242,166,90,0.7)] scale-102 ring-4 ring-[#F2A65A]/40' 
                    : currentCartridge 
                      ? 'border-[#F2A65A]/70 shadow-[0_0_20px_rgba(242,166,90,0.25)]' 
                      : 'border-dashed border-[#F2A65A]/50 hover:border-[#F2A65A] shadow-[0_0_12px_rgba(242,166,90,0.15)]'
                  }`}
              >
                <div className="absolute inset-x-6 top-2 h-1 bg-white/10 rounded-full" />

                {/* Seated Cartridge Head */}
                {currentCartridge ? (
                  <div className="relative w-56 sm:w-64 h-22 -mt-4 rounded-t-xl bg-gradient-to-t from-[#1b1e26] to-[#2d323e] border-t-2 border-x-2 border-[#F2A65A] shadow-[0_-8px_20px_rgba(0,0,0,0.6)] px-4 py-2 flex flex-col justify-between select-none">
                    <div className="flex items-center justify-between px-2 opacity-50">
                      <div className="w-1.5 h-1.5 rounded-full bg-black/60" />
                      <div className="flex-1 mx-2 h-0.5 bg-white/20 rounded" />
                      <div className="w-1.5 h-1.5 rounded-full bg-black/60" />
                    </div>

                    <div className="flex items-center justify-between gap-2 mt-1">
                      <div className="flex items-center gap-2">
                        <div 
                          className="w-7 h-7 rounded-full flex items-center justify-center shadow-md shrink-0"
                          style={{ 
                            backgroundColor: `${currentCartridge.accentColor || '#F2A65A'}30`, 
                            border: `1.5px solid ${currentCartridge.accentColor || '#F2A65A'}` 
                          }}
                        >
                          <IconDisc className="w-4 h-4 animate-spin-slow" style={{ color: currentCartridge.accentColor || '#F2A65A' }} />
                        </div>
                        <div>
                          <span className="text-xs font-mono font-extrabold text-white uppercase block leading-tight">
                            {currentCartridge.title}
                          </span>
                          <span className="text-[10px] font-mono text-[#F2A65A] block">
                            {isBooting ? 'BOOTING...' : 'ACTIVE IN DOCK'}
                          </span>
                        </div>
                      </div>

                      <button
                        onClick={onEject}
                        title="Eject cartridge back to shelf"
                        className="p-1.5 rounded-lg bg-black/50 hover:bg-rose-500/20 text-gray-400 hover:text-rose-300 border border-white/10 transition-colors cursor-pointer"
                      >

                    <div className="w-full h-1 bg-[#0d0f12] rounded-full overflow-hidden mt-1">
                      <div

    };

    // =========================================================================
    const ContactView = () => {
      const { contact } = PORTFOLIO_DATA;
      const [copied, setCopied] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });

      const handleCopyEmail = () => {
        soundManager.playClick();
        navigator.clipboard.writeText(contact.email);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        soundManager.playClick();
        window.location.href = 'mailto:' + encodeURIComponent(contact.email) + '?subject=' + encodeURIComponent('Portfolio inquiry from ' + formData.name) + '&body=' + encodeURIComponent('From: ' + formData.name + '\nEmail: ' + formData.email + '\n\n' + formData.message);
      };

      const getIcon = (iconName) => {
        switch (iconName.toLowerCase()) {
          case 'github': return <IconGithub className="w-5 h-5 text-gray-200" />;
          case 'linkedin': return <IconLinkedin className="w-5 h-5 text-sky-400" />;
          case 'itch':
          case 'itch.io': return <IconGamepad2 className="w-5 h-5 text-rose-400" />;
          default: return <IconExternalLink className="w-5 h-5 text-[#F2A65A]" />;
        }
      };

      return (
        <div className="portfolio-content w-full max-w-3xl mx-auto py-8 sm:py-12 px-4 sm:px-6 space-y-10">
          <div className="pb-6 border-b border-white/10 space-y-1">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
              Contact
            </h1>
            <p className="text-xs text-gray-400 font-mono">
              Get in touch for gameplay opportunities and project collaboration.
            </p>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between p-5 rounded-2xl bg-[#1c1f26] border border-white/8 gap-4">
            <div className="flex items-center gap-3 text-center sm:text-left">
              <div className="w-10 h-10 rounded-xl bg-[#F2A65A]/20 border border-[#F2A65A]/40 flex items-center justify-center shrink-0">
                <IconMail className="w-5 h-5 text-[#F2A65A]" />
              </div>
              <div>
                <span className="text-[10px] font-mono text-gray-400 uppercase block">DIRECT EMAIL</span>
                <span className="text-sm font-bold text-white font-mono">{contact.email}</span>
              </div>
            </div>

            <button
              onClick={handleCopyEmail}
              className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#252830] hover:bg-[#2e3340] text-xs font-mono text-gray-200 transition-colors cursor-pointer border border-white/8"
            >
              {copied ? (
                <>
                  <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                  <span className="text-emerald-400">Copied!</span>
                </>
              ) : (
                <>
                  <IconCopy className="w-3.5 h-3.5 text-gray-400" />
                  <span>Copy Email</span>
                </>
              )}
            </button>
          </div>

          <div className="p-6 sm:p-8 rounded-2xl bg-[#1c1f26] border border-white/8 space-y-5">
            <h2 className="text-sm font-bold text-white">
              Send a Transmission
            </h2>

            {submitted ? (
              <div className="p-6 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-center space-y-2">
                <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center">
                  <IconCheck className="w-5 h-5" />
                </div>
                <h3 className="text-sm font-bold text-emerald-300">Message Transmitted</h3>
                <p className="text-xs text-gray-400">Thank you! Your message has been sent to Steven.</p>
                <button
                  onClick={() => { setSubmitted(false); setFormData({ name: '', email: '', message: '' }); }}
                  className="mt-3 text-xs font-mono text-[#F2A65A] hover:underline cursor-pointer"
                >
                  Send another message
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                <p className="text-xs text-gray-400">Opens your email app. Please review and send your message there.</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-mono text-gray-400 mb-1">Your Name</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                      placeholder="e.g. Alex Chen"
                      className="w-full px-3.5 py-2 rounded-xl bg-[#14161a] border border-white/8 text-xs text-white focus:outline-none focus:border-[#F2A65A]/80 font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-gray-400 mb-1">Your Email</label>
                    <input
                      type="email"
                      required
                      value={formData.email}
                      onChange={e => setFormData({ ...formData, email: e.target.value })}
                      placeholder="alex@studio.com"
                      className="w-full px-3.5 py-2 rounded-xl bg-[#14161a] border border-white/8 text-xs text-white focus:outline-none focus:border-[#F2A65A]/80 font-mono"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-mono text-gray-400 mb-1">Message</label>
                  <textarea
                    required
                    rows="4"
                    value={formData.message}
                    onChange={e => setFormData({ ...formData, message: e.target.value })}
                    placeholder="Tell me about your gameplay engineering role, team, or project..."
                    className="w-full px-3.5 py-2 rounded-xl bg-[#14161a] border border-white/8 text-xs text-white focus:outline-none focus:border-[#F2A65A]/80 font-mono resize-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-[#F2A65A] text-[#17191C] font-mono text-xs font-bold uppercase tracking-wider hover:bg-[#f5b370] transition-colors cursor-pointer shadow-md"
                >
                  Open Email App
                </button>
              </form>
            )}
          </div>

          <div className="space-y-3">
            <h2 className="text-xs font-mono uppercase text-gray-400 tracking-wider font-bold">
              Profiles &amp; Repositories
            </h2>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              {contact.links.map((link, idx) => (
                <a
                  key={idx}
                  href={link.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex items-center gap-3 p-3.5 rounded-xl bg-[#1c1f26] hover:bg-[#252830] border border-white/8 hover:border-[#F2A65A]/40 transition-colors group cursor-pointer"
                >
                  <div className="w-8 h-8 rounded-lg bg-black/40 flex items-center justify-center">
                    {getIcon(link.icon)}
                  </div>
                  <div>
                    <span className="text-xs font-mono font-bold text-white group-hover:text-[#F2A65A] transition-colors block">
                      {link.label}
                    </span>
                    <span className="text-[10px] font-mono text-gray-500">Visit profile</span>
                  </div>
                </a>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 14. ROOT APP COMPONENT
    // =========================================================================
    const App = () => {
      const [currentTab, setCurrentTab] = useState('games');
      const [, refreshProfile] = useState(0);
      React.useEffect(() => {
        const handle = e => {
          if (e.origin !== location.origin || e.source !== window.parent || window.parent === window || e.data.type !== 'portfolio-update') return;
          const playingFrame=document.querySelector('.arcade-screen iframe');
          playingFrame?.contentWindow?.postMessage({type:'unity-quit'},location.origin);
          clearTimeout(bootTimer.current);
          setActiveProject(null);setBootingProject(null);setIsBooting(false);setIsArcadeOpen(false);
          applyProfile(e.data.config);
          if (['games','about','resume','contact'].includes(e.data.tab)) setCurrentTab(e.data.tab);
          if(e.data.projectId) setTechDetailProject(PORTFOLIO_DATA.games.find(p=>p.id===e.data.projectId)||null);
          else if(e.data.tab==='games') setTechDetailProject(null);
          refreshProfile(n => n+1);
        };
        window.addEventListener('message',handle);
        if(window.parent !== window) window.parent.postMessage({type:'portfolio-ready',original:ORIGINAL_PROFILE},location.origin);
        return () => window.removeEventListener('message',handle);
      }, []);
      const [activeProject, setActiveProject] = useState(null);
      const [bootingProject, setBootingProject] = useState(null);
      const [draggedCartridgeId, setDraggedCartridgeId] = useState(null);
      const [isBooting, setIsBooting] = useState(false);
      const [isArcadeOpen, setIsArcadeOpen] = useState(false);
      const [techDetailProject, setTechDetailProject] = useState(null);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const bootTimer=useRef(null);
      useEffect(()=>()=>clearTimeout(bootTimer.current),[]);

      const handleToggleSound = () => {
        const newState = soundManager.toggleSound();
        setSoundEnabled(newState);
      };

      const handleMountAndLaunch = (project) => {
        if (isBooting) return;
        if(project.player?.mode==='none'||(project.player?.mode!=='sample'&&!project.player?.url)){setTechDetailProject(project);return;}
        if (activeProject?.id === project.id && isArcadeOpen) return;

        soundManager.playCartridgeInsert();
        setBootingProject(project);
        setIsBooting(true);
        setDraggedCartridgeId(null);

        bootTimer.current=setTimeout(() => {
          soundManager.playConsoleBoot();
          setActiveProject(project);
          setBootingProject(null);
          setIsBooting(false);
          setIsArcadeOpen(true);
        }, 1200);
      };

      const handleEject = () => {
        clearTimeout(bootTimer.current);
        soundManager.playEject();
        setActiveProject(null);
        setBootingProject(null);
        setDraggedCartridgeId(null);
        setIsBooting(false);
        setIsArcadeOpen(false);
      };

      const activeGameId = activeProject?.id || bootingProject?.id || null;

      return (
        <div className="min-h-screen bg-[#17191C] text-[#E5E7EB] flex flex-col font-sans selection:bg-[#F2A65A]/25 selection:text-[#F2A65A]">
          <Navbar
            currentTab={currentTab}
            onTabChange={setCurrentTab}
            soundEnabled={soundEnabled}
            onToggleSound={handleToggleSound}
          />

          <main className="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex flex-col items-center">
            {currentTab === 'games' && (
              <div className="w-full flex flex-col items-center space-y-8">
                <div className="text-center">
                  <h1 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
                    {PORTFOLIO_DATA.hero.title}
                  </h1>
                </div>

                <CartridgeShowcase
                  projects={PORTFOLIO_DATA.games.filter(p=>!p.hidden)}
                  activeProject={activeProject}
                  bootingProject={bootingProject}
                  activeGameId={activeGameId}
                  draggedCartridgeId={draggedCartridgeId}
                  onDragStart={setDraggedCartridgeId}
                  onDragEnd={() => setDraggedCartridgeId(null)}
                  onOpenTechDetails={setTechDetailProject}
                  onMountAndLaunch={handleMountAndLaunch}
                />

                <CompactConsoleDock
                  projects={PORTFOLIO_DATA.games.filter(p=>!p.hidden)}
                  activeProject={activeProject}
                  bootingProject={bootingProject}
                  isBooting={isBooting}
                  onMountAndLaunch={handleMountAndLaunch}
                  onEject={handleEject}
                />
              </div>
            )}

            {currentTab === 'about' && <AboutView />}
            {currentTab === 'resume' && <ResumeView />}
            {currentTab === 'contact' && <ContactView />}
          </main>

          <GameplayArcadeModal
            project={activeProject}
            isOpen={isArcadeOpen}
            onCloseAndEject={handleEject}
          />

          <ProjectDetailModal
            project={techDetailProject}
            onClose={() => setTechDetailProject(null)}
            onPlayDemo={(p) => {
              setTechDetailProject(null);
              setCurrentTab('games');
              handleMountAndLaunch(p);
            }}
          />
        </div>
      );
    };

    // Mount to DOM root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
